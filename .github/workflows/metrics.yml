name: Metrics

on:
  schedule: [{ cron: "0 0 * * *" }]   # refresh once a day
  workflow_dispatch:                  # lets you trigger it manually from the Actions tab
  push: { branches: ["main", "master"] }

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) Profile stats overview — replaces the flaky github-readme-stats.vercel.app card
      - name: Stats overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stats.svg
          base: "header, activity, community, repositories, metadata"
          config_timezone: Asia/Kolkata
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5

      # 2) Achievements — replaces the flaky github-profile-trophy.vercel.app card
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: detailed
          plugin_achievements_limit: 8

      # 3) Full-year isometric contribution calendar (with streak stats)
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 4) Most-used languages, overall, with real byte/line stats
      - name: Most used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, lines
          plugin_languages_limit: 8

      # 5) Recently used languages, from the last 14 days of activity
      #    (shows "No recent push activity found" if there were no pushes in that window —
      #    that's expected/correct, not an error)
      - name: Recently used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.recent.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
