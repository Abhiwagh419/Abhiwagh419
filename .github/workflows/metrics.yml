
name: Metrics
 
on:
  schedule: [{ cron: "0 0 * * *" }]   # refresh once a day
  workflow_dispatch:                  # lets you trigger it manually from the Actions tab
  push: { branches: ["main", "master"] }
 
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1) Full-year isometric contribution calendar (with streak stats)
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
 
      # 2) Most-used languages, overall, with real byte/line stats
      - name: Most used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, lines
          plugin_languages_limit: 8
 
      # 3) Recently used languages, from the last 14 days of activity
      - name: Recently used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.recent.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: recently-used
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
 
